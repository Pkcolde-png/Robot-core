<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RPG Engine 3D - Edição Completa</title>
    <style>
        /* --- ESTILOS GERAIS --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0f12;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* --- TELA DE CARREGAMENTO --- */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0d0f12;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #1a233a;
            border-top: 4px solid #f1c40f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }

        #loader p {
            color: #ffffff;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- MENUS E INTERFACES --- */
        .glass-panel {
            background: rgba(13, 15, 18, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            color: #ffffff;
        }

        .btn-yellow {
            background: none;
            border: none;
            color: #f1c40f;
            font-size: 1.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            text-align: left;
            padding: 10px 0;
            transition: transform 0.2s, color 0.2s;
        }

        .btn-yellow:hover {
            color: #ffffff;
            transform: translateX(10px);
        }

        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            align-items: center;
            padding-left: 8%;
            background: linear-gradient(90deg, rgba(13,15,18,1) 30%, rgba(13,15,18,0) 100%);
        }

        #menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #menu-title {
            color: #ffffff;
            font-size: 3rem;
            margin-bottom: 40px;
            letter-spacing: 4px;
            text-transform: uppercase;
            border-left: 5px solid #f1c40f;
            padding-left: 15px;
        }

        #btn-pause-trigger {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 50;
            background: rgba(241, 196, 15, 0.2);
            border: 2px solid #f1c40f;
            color: #f1c40f;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            display: none;
        }

        #pause-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            background: rgba(13, 15, 18, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            display: none;
        }

        .modal-content {
            padding: 40px;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: center;
        }

        .modal-content h2 {
            color: #ffffff;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        #pause-stats {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 12px;
            font-size: 0.9rem;
            color: #f1c40f;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            border-radius: 4px;
        }

        .modal-content button {
            background: #1c232e;
            border: 1px solid rgba(255,255,255,0.1);
            color: #ffffff;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.2s;
        }

        .modal-content button:hover {
            background: #f1c40f;
            color: #0d0f12;
        }

        #controls-settings {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 300;
            background: rgba(13, 15, 18, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            display: none;
        }

        .settings-box {
            padding: 30px;
            width: 400px;
            max-width: 90%;
        }

        .toggle-container {
            margin: 25px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* --- INTERFACE DE JOGO (HUD) --- */
        #game-hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: none;
        }

        #health-container {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 140px;
            pointer-events: auto;
        }

        .bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(28, 35, 46, 0.6);
            border-radius: 2px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .bar-fill {
            width: 100%;
            height: 100%;
            background: #e74c3c;
            transition: width 0.15s linear;
        }

        #dialogue-container {
            position: absolute;
            top: 45px;
            left: 20px;
            width: 280px;
            max-width: 85vw;
            background: rgba(13, 15, 18, 0.9);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 0px;
            pointer-events: auto; /* Permite interação direta com a caixa */
            transform: translateX(-350px);
            transition: transform 0.4s ease;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #dialogue-container.visible {
            transform: translateX(0);
        }

        #dialogue-title {
            color: #f1c40f;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        #dialogue-text {
            color: #ffffff;
            font-size: 0.85rem;
            line-height: 1.15rem;
        }

        #btn-dialogue-next {
            align-self: flex-end;
            background: #1c232e;
            border: 1px solid rgba(255,255,255,0.2);
            color: #f1c40f;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            padding: 4px 10px;
            cursor: pointer;
            border-radius: 2px;
            pointer-events: auto; /* Garante blindagem de eventos */
        }

        #btn-dialogue-next:hover {
            background: #f1c40f;
            color: #0d0f12;
        }

        /* --- CONTROLES VIRTUAIS --- */
        #mobile-hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: none;
        }

        #joystick-zone {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50vw;
            height: 60vh;
            pointer-events: auto;
        }

        #joystick-wrapper {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
        }

        #joystick-handle {
            width: 50px;
            height: 50px;
            background: #f1c40f;
            border-radius: 50%;
            position: absolute;
            top: 33px;
            left: 33px;
            transition: transform 0.05s linear;
        }

        #btn-mobile-jump {
            position: absolute;
            bottom: 50px;
            right: 40px;
            width: 80px;
            height: 80px;
            background: rgba(241, 196, 15, 0.2);
            border: 3px solid #f1c40f;
            border-radius: 50%;
            color: #ffffff;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            cursor: pointer;
            font-size: 0.95rem;
            text-transform: uppercase;
        }

        #desktop-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.75rem;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p>Carregando Recursos Engine...</p>
    </div>

    <!-- Menu Inicial -->
    <div id="main-menu">
        <div id="menu-content">
            <h1 id="menu-title">Robot Core</h1>
            <div id="menu-buttons">
                <button class="btn-yellow" id="btn-play">Jogar</button>
                <button class="btn-yellow" id="btn-menu-controls">Controles</button>
                <button class="btn-yellow" id="btn-exit" onclick="alert('Funcionalidade aplicável em builds nativas.')">Sair</button>
            </div>
        </div>
    </div>

    <button id="btn-pause-trigger">Pause</button>

    <!-- Menu Pause -->
    <div id="pause-menu">
        <div class="modal-content glass-panel">
            <h2>Jogo Pausado</h2>
            <div id="pause-stats">Parafusos: <span id="screw-count-display">0</span>/6</div>
            <button id="btn-resume">Continuar Jogo</button>
            <button id="btn-pause-controls">Controles</button>
            <button id="btn-quit-menu">Sair para o Menu</button>
        </div>
    </div>

    <!-- Opções de Controles -->
    <div id="controls-settings">
        <div class="settings-box glass-panel">
            <h2 style="text-align:center;">Configurar Input</h2>
            <hr style="opacity:0.1; margin: 15px 0;">
            
            <div class="toggle-container">
                <span>Modo de Entrada:</span>
                <button id="btn-toggle-input" class="modal-content" style="width:auto; padding:8px 15px; margin:0;">Teclado e Mouse</button>
            </div>

            <div id="controls-legend" style="font-size:0.8rem; color:#aaa; line-height:1.2rem; margin-bottom:20px;"></div>

            <button id="btn-close-controls" style="width:100%; padding:10px; background:#f1c40f; color:#0d0f12; border:none; font-weight:bold; border-radius:4px; cursor:pointer;">VOLTAR</button>
        </div>
    </div>

    <!-- GAME HUD -->
    <div id="game-hud">
        <div id="health-container">
            <div class="bar-bg">
                <div class="bar-fill" id="hp-bar"></div>
            </div>
        </div>

        <div id="dialogue-container">
            <div id="dialogue-title">Sistema Core [X-1]</div>
            <div id="dialogue-text">Carregando dados...</div>
            <button id="btn-dialogue-next">Próximo</button>
        </div>
    </div>

    <!-- HUD Mobile -->
    <div id="mobile-hud">
        <div id="joystick-zone">
            <div id="joystick-wrapper">
                <div id="joystick-handle"></div>
            </div>
        </div>
        <div id="btn-mobile-jump">Pulo</div>
    </div>

    <div id="desktop-info" class="hud-game-element">Controles: WASD para mover. Mouse gira câmera. Espaço pula!</div>

    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- ESTADOS DO JOGO ---
        const STATES = { MENU: 'menu', PLAYING: 'playing', PAUSED: 'paused' };
        let gameState = STATES.MENU;

        const INPUT_MODES = { KEYBOARD: 'keyboard', MOBILE: 'mobile' };
        let currentInputMode = INPUT_MODES.KEYBOARD;

        // --- ELEMENTOS TRIDIMENSIONAIS ---
        const container = document.getElementById('canvas-container');
        let scene, camera, renderer, clock;
        
        let player = null;
        let mixer = null;
        const animations = {};
        let currentAction = null;

        // Atributos do Jogador
        let playerHP = 100;
        const maxHP = 100;
        let lastDamageTime = 0;

        // Listas Mecânicas
        let totalScrewsCollected = 0;
        const totalScrewsInLevel = 6;
        const screwsArray = [];
        const rockPlatforms = []; 
        const hazardsArray = [];   

        // MECÂNICA DE CHAVE E PORTAL (FIM DA FASE 1)
        let hiddenKeyMesh = null;
        let escapePortalMesh = null;
        let isKeySpawned = false;
        let isKeyCollected = false;

        // Inputs Teclado
        const keysPressed = { w: false, a: false, s: false, d: false, space: false };

        // Câmera Orbital 3ª Pessoa
        let camTheta = Math.PI / 2;
        let camPhi = Math.PI / 2.5; 
        const camDistance = 8;      

        // Movimentação e Física
        const moveSpeed = 7.5;
        const turnSpeed = 15.0; 
        let verticalVelocity = 0;
        const gravity = 28.0; 
        const jumpForce = 11.5;
        let isGrounded = true;

        const arenaRadius = 45;
        const playerRadius = 0.5;

        // --- SISTEMA INDEPENDENTE DE MULTI-TOUCH MOBILE ---
        let joystickTouchId = null;
        let cameraTouchId = null;
        let joystickCenter = { x: 0, y: 0 };
        let joystickVector = { x: 0, y: 0 };
        let touchStartCamPos = { x: 0, y: 0 };
        let touchStartTheta = 0;
        let touchStartPhi = 0;

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color('#7ec0ee');
            scene.fog = new THREE.FogExp2('#7ec0ee', 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.5, 300);

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance", precision: "mediump" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(1);
            
            container.appendChild(renderer.domElement);
            clock = new THREE.Clock();

            // Luzes
            const ambientLight = new THREE.AmbientLight('#ffffff', 1.4);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight('#ffffff', 1.2);
            dirLight.position.set(20, 40, 20);
            scene.add(dirLight);

            createScenicMountains();    
            createRockPillarParkour();  
            createThreeHazards();       
            createIncliniedScrews();    
            createEscapePortal();       
            loadCharacter();
            setupDOMEvents();
            updateControlsLegend();
            setupFullScreenTrigger(); 

            // Ouvintes Teclado e Mouse
            window.addEventListener('resize', onWindowResize, false);
            window.addEventListener('keydown', (e) => updateInputState(e, true), false);
            window.addEventListener('keyup', (e) => updateInputState(e, false), false);

            let isMouseDown = false;
            let previousMousePosition = { x: 0, y: 0 };

            window.addEventListener('mousedown', (e) => {
                // Impede rotação de câmera indesejada se clicar nas áreas da interface HUD
                if(currentInputMode === INPUT_MODES.MOBILE || e.target.tagName === 'BUTTON' || e.target.closest('#game-hud')) return;
                isMouseDown = true;
                previousMousePosition = { x: e.clientX, y: e.clientY };
            }, false);

            window.addEventListener('mousemove', (e) => {
                if (!isMouseDown || currentInputMode === INPUT_MODES.MOBILE) return;
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;
                camTheta -= deltaX * 0.005;
                camPhi -= deltaY * 0.005;
                camPhi = Math.max(0.3, Math.min(Math.PI / 2.2, camPhi));
                previousMousePosition = { x: e.clientX, y: e.clientY };
            }, false);

            window.addEventListener('mouseup', () => isMouseDown = false, false);

            // Ouvintes Multi-Touch Mobile
            window.addEventListener('touchstart', (e) => {
                if (currentInputMode !== INPUT_MODES.MOBILE || gameState !== STATES.PLAYING) return;
                
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    
                    if (touch.target.id === 'btn-mobile-jump') {
                        keysPressed.space = true;
                        continue;
                    }

                    if (touch.clientX < window.innerWidth / 2 && joystickTouchId === null) {
                        joystickTouchId = touch.identifier;
                        const wrapper = document.getElementById('joystick-wrapper');
                        const rect = wrapper.getBoundingClientRect();
                        joystickCenter.x = rect.left + rect.width / 2;
                        joystickCenter.y = rect.top + rect.height / 2;
                        continue;
                    }

                    if (touch.clientX >= window.innerWidth / 2 && cameraTouchId === null && touch.target.tagName !== 'BUTTON' && !touch.target.closest('#game-hud')) {
                        cameraTouchId = touch.identifier;
                        touchStartCamPos.x = touch.clientX;
                        touchStartCamPos.y = touch.clientY;
                        touchStartTheta = camTheta;
                        touchStartPhi = camPhi;
                    }
                }
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (currentInputMode !== INPUT_MODES.MOBILE || gameState !== STATES.PLAYING) return;

                for (let i = 0; i < e.touches.length; i++) {
                    const touch = e.touches[i];

                    if (touch.identifier === joystickTouchId) {
                        let distX = touch.clientX - joystickCenter.x;
                        let distY = touch.clientY - joystickCenter.y;
                        const distance = Math.sqrt(distX * distX + distY * distY);
                        const maxRadius = 45;

                        if (distance > maxRadius) {
                            distX = (distX / distance) * maxRadius;
                            distY = (distY / distance) * maxRadius;
                        }

                        document.getElementById('joystick-handle').style.transform = `translate(${distX}px, ${distY}px)`;
                        joystickVector.x = distX / maxRadius;
                        joystickVector.y = distY / maxRadius;
                    }

                    if (touch.identifier === cameraTouchId) {
                        const deltaX = touch.clientX - touchStartCamPos.x;
                        const deltaY = touch.clientY - touchStartCamPos.y;
                        camTheta = touchStartTheta - deltaX * 0.007;
                        camPhi = touchStartPhi - deltaY * 0.007;
                        camPhi = Math.max(0.3, Math.min(Math.PI / 2.2, camPhi));
                    }
                }
            }, { passive: true });

            window.addEventListener('touchend', (e) => {
                if (currentInputMode !== INPUT_MODES.MOBILE) return;

                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];

                    if (touch.target.id === 'btn-mobile-jump') {
                        keysPressed.space = false;
                    }
                    if (touch.identifier === joystickTouchId) {
                        joystickTouchId = null;
                        joystickVector = { x: 0, y: 0 };
                        document.getElementById('joystick-handle').style.transform = 'translate(0px, 0px)';
                    }
                    if (touch.identifier === cameraTouchId) {
                        cameraTouchId = null;
                    }
                }
            }, { passive: true });

            animate();
        }

        // REINTRODUÇÃO DO FULLSCREEN INSTANTÂNEO GLOBAL EM QUALQUER TOQUE NA ARENA
        function setupFullScreenTrigger() {
            const triggerFullscreen = () => {
                if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => {});
                }
            };
            container.addEventListener('click', triggerFullscreen, false);
            container.addEventListener('touchstart', triggerFullscreen, { passive: true });
        }

        function createScenicMountains() {
            const floorGeo = new THREE.PlaneGeometry(120, 120);
            const floorMat = new THREE.MeshBasicMaterial({ color: 0x3d352e });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const grid = new THREE.GridHelper(120, 30, 0x241f1b, 0x2e2722);
            grid.position.y = 0.01;
            scene.add(grid);

            const mountainGeo = new THREE.BoxGeometry(11, 18, 11);
            const rockMat = new THREE.MeshBasicMaterial({ color: 0x2c2520 }); 

            const totalMountains = 36;
            for(let i = 0; i < totalMountains; i++) {
                const angle = (i / totalMountains) * Math.PI * 2;
                const mountainMesh = new THREE.Mesh(mountainGeo, rockMat);
                const radius = arenaRadius + 3.5;
                mountainMesh.position.set(Math.cos(angle) * radius, 9, Math.sin(angle) * radius);
                mountainMesh.rotation.y = Math.random() * Math.PI;
                mountainMesh.matrixAutoUpdate = false;
                mountainMesh.updateMatrix();
                scene.add(mountainMesh);
            }
        }

        function createRockPillarParkour() {
            const pillarMat = new THREE.MeshBasicMaterial({ color: 0x423a32 }); 
            const bridgeMat = new THREE.MeshBasicMaterial({ color: 0x362f29 }); 

            const rockDefs = [
                { type: 'cylinder', x: -14, y: 0.8, z: 8, r: 2.2, h: 1.6 },
                { type: 'cylinder', x: -14, y: 1.8, z: 14, r: 2.2, h: 3.6 },
                { type: 'bridge', x: -10, y: 3.0, z: 14, w: 6, h: 1.0, d: 2.5 },
                { type: 'cylinder', x: -6, y: 2.5, z: 14, r: 2.0, h: 5.0 },
                { type: 'cylinder', x: 14, y: 0.9, z: -14, r: 2.2, h: 1.8 },
                { type: 'cylinder', x: 14, y: 1.9, z: -20, r: 2.0, h: 3.8 },
                { type: 'bridge', x: 8, y: 3.2, z: -20, w: 6, h: 1.2, d: 2.5 },
                { type: 'cylinder', x: 0, y: 1.4, z: 22, r: 2.5, h: 2.8 },
                { type: 'cylinder', x: -22, y: 1.0, z: -18, r: 2.2, h: 2.0 }
            ];

            rockDefs.forEach((rock) => {
                let mesh;
                let bBox;

                if (rock.type === 'cylinder') {
                    const geo = new THREE.CylinderGeometry(rock.r, rock.r + 0.3, rock.h, 6);
                    mesh = new THREE.Mesh(geo, pillarMat);
                    mesh.position.set(rock.x, rock.y, rock.z);
                    bBox = { minX: rock.x - rock.r, maxX: rock.x + rock.r, minY: 0, maxY: rock.y + rock.h / 2, minZ: rock.z - rock.r, maxZ: rock.z + rock.r };
                } else {
                    const geo = new THREE.BoxGeometry(rock.w, rock.h, rock.d);
                    mesh = new THREE.Mesh(geo, bridgeMat);
                    mesh.position.set(rock.x, rock.y, rock.z);
                    bBox = { minX: rock.x - rock.w / 2, maxX: rock.x + rock.w / 2, minY: 0, maxY: rock.y + rock.h / 2, minZ: rock.z - rock.d / 2, maxZ: rock.z + rock.d / 2 };
                }

                mesh.matrixAutoUpdate = false;
                mesh.updateMatrix();
                scene.add(mesh);
                rockPlatforms.push(bBox);
            });
        }

        function createThreeHazards() {
            const hazardGeo = new THREE.CylinderGeometry(3.5, 3.5, 0.1, 8);
            const hazardMat = new THREE.MeshBasicMaterial({ color: 0x00d2ff, transparent: true, opacity: 0.7 });
            const positions = [{ x: 5, z: -2 }, { x: -14, z: -4 }, { x: 12, z: 15 }];

            positions.forEach((pos) => {
                const puddle = new THREE.Mesh(hazardGeo, hazardMat);
                puddle.position.set(pos.x, 0.04, pos.z);
                scene.add(puddle);
                hazardsArray.push({ x: pos.x, z: pos.z, radius: 3.5 });
            });
        }

        function createIncliniedScrews() {
            const headGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.08, 6); 
            const threadGeo = new THREE.CylinderGeometry(0.09, 0.09, 0.35, 5); 
            const screwMat = new THREE.MeshBasicMaterial({ color: 0xd35400 });

            const spots = [
                { x: -14, y: 2.2, z: 8 },      
                { x: -10, y: 4.1, z: 14 },     
                { x: -6, y: 5.6, z: 14 },      
                { x: 8, y: 4.4, z: -20 },      
                { x: 0, y: 3.4, z: 22 },       
                { x: -22, y: 2.5, z: -18 }     
            ];

            spots.forEach((pos) => {
                const sGroup = new THREE.Group();
                const head = new THREE.Mesh(headGeo, screwMat); head.position.y = 0.15; head.matrixAutoUpdate = false; head.updateMatrix(); sGroup.add(head);
                const thread = new THREE.Mesh(threadGeo, screwMat); thread.position.y = -0.05; thread.matrixAutoUpdate = false; thread.updateMatrix(); sGroup.add(thread);
                sGroup.rotation.x = 0.7; sGroup.rotation.z = 0.6;
                sGroup.position.set(pos.x, pos.y, pos.z);
                scene.add(sGroup);
                screwsArray.push(sGroup); 
            });
        }

        function createEscapePortal() {
            const frameGeo = new THREE.BoxGeometry(4, 6, 0.6);
            const frameMat = new THREE.MeshBasicMaterial({ color: 0x1c232e });
            const frame = new THREE.Mesh(frameGeo, frameMat);
            frame.position.set(0, 3, -26); 
            scene.add(frame);

            const fieldGeo = new THREE.PlaneGeometry(3.2, 5.2);
            const fieldMat = new THREE.MeshBasicMaterial({ color: 0x962d22, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
            escapePortalMesh = new THREE.Mesh(fieldGeo, fieldMat);
            escapePortalMesh.position.set(0, 3, -25.6);
            scene.add(escapePortalMesh);
        }

        function spawnHiddenKey() {
            isKeySpawned = true;
            
            const keyGroup = new THREE.Group();
            const ringGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.1, 8);
            const shaftGeo = new THREE.CylinderGeometry(0.08, 0.08, 1.0, 6);
            const toothGeo = new THREE.BoxGeometry(0.3, 0.3, 0.1);
            const keyMat = new THREE.MeshBasicMaterial({ color: 0xf1c40f });

            const ring = new THREE.Mesh(ringGeo, keyMat); ring.rotation.x = Math.PI/2; ring.position.y = 0.6; keyGroup.add(ring);
            const shaft = new THREE.Mesh(shaftGeo, keyMat); shaft.position.y = 0; keyGroup.add(shaft);
            const tooth = new THREE.Mesh(toothGeo, keyMat); tooth.position.set(0.15, -0.3, 0); keyGroup.add(tooth);

            let validPosition = false;
            let randomX = 0;
            let randomZ = 0;
            let attempts = 0;

            while (!validPosition && attempts < 200) {
                attempts++;
                const angle = Math.random() * Math.PI * 2;
                const radius = Math.random() * 32; 
                randomX = Math.cos(angle) * radius;
                randomZ = Math.sin(angle) * radius;

                let hitPlatform = false;
                const buffer = 1.5; 
                
                for (let i = 0; i < rockPlatforms.length; i++) {
                    const box = rockPlatforms[i];
                    if (randomX > (box.minX - buffer) && randomX < (box.maxX + buffer) &&
                        randomZ > (box.minZ - buffer) && randomZ < (box.maxZ + buffer)) {
                        hitPlatform = true;
                        break;
                    }
                }

                if (randomX > -3 && randomX < 3 && randomZ > -29 && randomZ < -23) {
                    hitPlatform = true;
                }

                if (!hitPlatform) {
                    validPosition = true;
                }
            }

            keyGroup.position.set(randomX, 0.5, randomZ);
            scene.add(keyGroup);
            hiddenKeyMesh = keyGroup;

            document.getElementById('dialogue-title').innerText = "Chave Detectada!";
            document.getElementById('dialogue-text').innerText = "SISTEMA: Todos os parafusos coletados! A CHAVE DOURADA materializou-se em uma coordenada limpa do terreno. Encontre-a para abrir o portal de saída!";
            document.getElementById('dialogue-container').classList.add('visible');
        }

        function loadCharacter() {
            const loader = new GLTFLoader();
            const modelUrl = 'https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb';

            loader.load(modelUrl, (gltf) => {
                player = gltf.scene;
                player.scale.set(0.35, 0.35, 0.35);
                player.position.set(0, 0, 0);
                
                player.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = false; child.receiveShadow = false;
                        if(child.material) { child.material.roughness = 1.0; child.material.metalness = 0.0; }
                    }
                });

                scene.add(player);
                mixer = new THREE.AnimationMixer(player);
                gltf.animations.forEach((clip) => { animations[clip.name] = mixer.clipAction(clip); });

                if (animations['Idle']) { currentAction = animations['Idle']; currentAction.play(); }

                const loaderElement = document.getElementById('loader');
                loaderElement.style.opacity = '0';
                setTimeout(() => loaderElement.remove(), 300);
            });
        }

        function setupDOMEvents() {
            document.getElementById('btn-play').addEventListener('click', () => setGameState(STATES.PLAYING));
            
            const configPanel = document.getElementById('controls-settings');
            document.getElementById('btn-menu-controls').addEventListener('click', () => { configPanel.style.display = 'flex'; });
            document.getElementById('btn-pause-controls').addEventListener('click', () => { configPanel.style.display = 'flex'; });
            document.getElementById('btn-close-controls').addEventListener('click', () => { configPanel.style.display = 'none'; });

            document.getElementById('btn-pause-trigger').addEventListener('click', () => setGameState(STATES.PAUSED));
            document.getElementById('btn-resume').addEventListener('click', () => setGameState(STATES.PLAYING));
            document.getElementById('btn-quit-menu').addEventListener('click', () => setGameState(STATES.MENU));
            
            // BLINDAGEM COMPLETA DO BOTÃO DE DIÁLOGO
            const btnDialogueNext = document.getElementById('btn-dialogue-next');
            const closeDialogueHandler = (e) => {
                e.stopPropagation(); // Impede o clique de vazar para a arena 3D de fundo
                e.preventDefault();  // Cancela comportamentos nativos indesejados
                document.getElementById('dialogue-container').classList.remove('visible');
            };
            btnDialogueNext.addEventListener('click', closeDialogueHandler, false);
            btnDialogueNext.addEventListener('touchstart', closeDialogueHandler, false);

            const btnToggleInput = document.getElementById('btn-toggle-input');
            btnToggleInput.addEventListener('click', () => {
                if (currentInputMode === INPUT_MODES.KEYBOARD) {
                    currentInputMode = INPUT_MODES.MOBILE;
                    btnToggleInput.innerText = "Controles Virtuais (Mobile)";
                } else {
                    currentInputMode = INPUT_MODES.KEYBOARD;
                    btnToggleInput.innerText = "Teclado e Mouse";
                }
                updateControlsLegend();
                updateHUDVisibility();
            });
        }

        function setGameState(newState) {
            gameState = newState;
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('pause-menu').style.display = 'none';
            document.getElementById('btn-pause-trigger').style.display = 'none';
            document.getElementById('game-hud').style.display = 'none';
            
            document.querySelectorAll('.hud-game-element').forEach(el => el.style.display = 'none');

            if (gameState === STATES.MENU) {
                document.getElementById('main-menu').style.display = 'flex';
                document.getElementById('dialogue-container').classList.remove('visible');
                playerHP = 100;
                totalScrewsCollected = 0;
                isKeySpawned = false;
                isKeyCollected = false;
                if(escapePortalMesh) escapePortalMesh.material.color.setHex(0x962d22); 
                document.getElementById('hp-bar').style.width = '100%';
                if(player) { player.position.set(0,0,0); fadeToAnimation('Idle', 0.1); }
                camTheta = Math.PI / 1.8; camPhi = Math.PI / 2.4;
            } 
            else if (gameState === STATES.PLAYING) {
                document.getElementById('btn-pause-trigger').style.display = 'block';
                document.getElementById('game-hud').style.display = 'block';
                
                if (totalScrewsCollected === 0) {
                    document.getElementById('dialogue-text').innerText = "OBJETIVO: Explore as montanhas, pule pelas rochas e colete os 6 parafusos para revelar a chave secreta da porta da próxima fase!";
                    document.getElementById('dialogue-container').classList.add('visible');
                }
                updateHUDVisibility();
            } 
            else if (gameState === STATES.PAUSED) {
                document.getElementById('screw-count-display').innerText = totalScrewsCollected;
                document.getElementById('pause-menu').style.display = 'flex';
            }
        }

        function updateHUDVisibility() {
            const mobileHud = document.getElementById('mobile-hud');
            const desktopInfo = document.getElementById('desktop-info');
            mobileHud.style.display = 'none'; desktopInfo.style.display = 'none';

            if (gameState === STATES.PLAYING) {
                if (currentInputMode === INPUT_MODES.MOBILE) mobileHud.style.display = 'block';
                else desktopInfo.style.display = 'block';
            }
        }

        function updateControlsLegend() {
            const legend = document.getElementById('controls-legend');
            if (currentInputMode === INPUT_MODES.KEYBOARD) {
                legend.innerHTML = `• <b>WASD:</b> Movimentar<br>• <b>ESPAÇO:</b> Pular sem travar<br>• <b>Arrastar Mouse:</b> Girar Câmera`;
            } else {
                legend.innerHTML = `• <b>Lado Esquerdo:</b> Joystick Direcional Integrado<br>• <b>Lado Direito:</b> Arraste para Girar a Câmera livremente<br>• <b>Botão Pulo:</b> Salta sem interferir no analógico`;
            }
        }

        function updateInputState(event, isPressed) {
            if(gameState !== STATES.PLAYING) return;
            let key = event.key.toLowerCase();
            if (key === ' ') key = 'space';
            if (key in keysPressed) keysPressed[key] = isPressed;
        }

        function fadeToAnimation(nextActionName, duration = 0.15) {
            if (!mixer || !animations[nextActionName]) return;
            const nextAction = animations[nextActionName];
            if (currentAction === nextAction) return;
            nextAction.enabled = true; nextAction.time = 0.0;
            nextAction.setEffectiveTimeScale(1.0); nextAction.setEffectiveWeight(1.0);
            nextAction.crossFadeFrom(currentAction, duration, true); nextAction.play();
            currentAction = nextAction;
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1); 

            if (mixer) mixer.update(delta);

            if (player) {
                if (gameState === STATES.PLAYING) {
                    updatePlayerMovementAndPhysics(delta);
                    updateCameraPosition();
                    updateGameElementsLogic(delta);
                } 
                else if (gameState === STATES.MENU) {
                    player.rotation.y += 0.3 * delta;
                    updateCameraMenuPosition();
                }
            }
            renderer.render(scene, camera);
        }

        function updateGameElementsLogic(delta) {
            const currentTime = clock.getElapsedTime();

            screwsArray.forEach(screw => screw.rotation.y += 2.2 * delta);

            for (let i = screwsArray.length - 1; i >= 0; i--) {
                const screw = screwsArray[i];
                const dist = player.position.distanceTo(screw.position);
                if (dist < 1.3) {
                    scene.remove(screw);
                    screwsArray.splice(i, 1);
                    totalScrewsCollected++;

                    if (totalScrewsCollected >= totalScrewsInLevel && !isKeySpawned) {
                        spawnHiddenKey();
                    }
                }
            }

            if (isKeySpawned && !isKeyCollected && hiddenKeyMesh) {
                hiddenKeyMesh.rotation.y += 3.0 * delta;
                
                if (player.position.distanceTo(hiddenKeyMesh.position) < 1.5) {
                    scene.remove(hiddenKeyMesh);
                    isKeyCollected = true;
                    
                    escapePortalMesh.material.color.setHex(0x2ecc71);

                    document.getElementById('dialogue-title').innerText = "Chave Adquirida!";
                    document.getElementById('dialogue-text').innerText = "PORTAL DESTRAVADO: Vá para o norte do cenário e passe pelas barreiras de energia verde para finalizar a fase 1!";
                    document.getElementById('dialogue-container').classList.add('visible');
                }
            }

            if (isKeyCollected) {
                const portalPos = new THREE.Vector3(0, 1, -26); 
                if (player.position.distanceTo(portalPos) < 2.5) {
                    alert("PARABÉNS! Você concluiu a Fase 1 com sucesso e destrancou o portal de transição!");
                    setGameState(STATES.MENU);
                }
            }

            let hitHazard = false;
            hazardsArray.forEach((h) => {
                const dX = player.position.x - h.x;
                const dZ = player.position.z - h.z;
                if (Math.sqrt(dX*dX + dZ*dZ) < h.radius && player.position.y <= 0.1) hitHazard = true;
            });

            if (hitHazard) {
                playerHP -= 25.0 * delta;
                lastDamageTime = currentTime;
                if (playerHP < 0) playerHP = 0;
                document.getElementById('hp-bar').style.width = `${playerHP}%`;

                if (playerHP === 0) {
                    alert("Unidade X-1 reiniciada!");
                    player.position.set(0, 0, 0);
                    playerHP = 100;
                    document.getElementById('hp-bar').style.width = '100%';
                }
            } else {
                if (currentTime - lastDamageTime > 3.0 && playerHP < maxHP) {
                    playerHP += 15.0 * delta;
                    if (playerHP > maxHP) playerHP = maxHP;
                    document.getElementById('hp-bar').style.width = `${playerHP}%`;
                }
            }
        }

        function updatePlayerMovementAndPhysics(delta) {
            let isInputMoving = false;
            let currentTargetRotation = player.rotation.y;

            if (keysPressed.space && isGrounded) {
                verticalVelocity = jumpForce;
                isGrounded = false;
                if (animations['Jump']) fadeToAnimation('Jump', 0.1);
            }

            verticalVelocity -= gravity * delta;
            let nextY = player.position.y + verticalVelocity * delta;

            const cameraAngle = Math.atan2(camera.position.x - player.position.x, camera.position.z - player.position.z);
            let inputX = 0;
            let inputZ = 0;

            if (currentInputMode === INPUT_MODES.KEYBOARD) {
                isInputMoving = keysPressed.w || keysPressed.s || keysPressed.a || keysPressed.d;
                if (isInputMoving) {
                    let localAngle = 0;
                    if (keysPressed.s && keysPressed.d) localAngle = Math.PI * 0.25;
                    else if (keysPressed.s && keysPressed.a) localAngle = -Math.PI * 0.25;
                    else if (keysPressed.w && keysPressed.d) localAngle = Math.PI * 0.75;
                    else if (keysPressed.w && keysPressed.a) localAngle = -Math.PI * 0.75;
                    else if (keysPressed.s) localAngle = 0;
                    else if (keysPressed.w) localAngle = Math.PI;
                    else if (keysPressed.d) localAngle = Math.PI * 0.5;
                    else if (keysPressed.a) localAngle = -Math.PI * 0.5;

                    currentTargetRotation = cameraAngle + localAngle;
                    inputX = Math.sin(currentTargetRotation);
                    inputZ = Math.cos(currentTargetRotation);
                }
            } 
            else if (currentInputMode === INPUT_MODES.MOBILE) {
                if (joystickTouchId !== null) {
                    isInputMoving = true;
                    const joystickAngle = Math.atan2(joystickVector.x, joystickVector.y);
                    currentTargetRotation = cameraAngle + joystickAngle;
                    inputX = Math.sin(currentTargetRotation);
                    inputZ = Math.cos(currentTargetRotation);
                }
            }

            let targetX = player.position.x + inputX * moveSpeed * delta;
            let targetZ = player.position.z + inputZ * moveSpeed * delta;

            let pMinX = targetX - playerRadius; let pMaxX = targetX + playerRadius;
            let pMinZ = player.position.z - playerRadius; let pMaxZ = player.position.z + playerRadius;
            let pMinY = player.position.y; let pMaxY = player.position.y + 1.8;

            rockPlatforms.forEach((box) => {
                if (pMaxX > box.minX && pMinX < box.maxX && pMaxZ > box.minZ && pMinZ < box.maxZ && pMaxY > box.minY && pMinY < box.maxY) {
                    targetX = player.position.x;
                }
            });

            pMinX = targetX - playerRadius; pMaxX = targetX + playerRadius;
            pMinZ = targetZ - playerRadius; pMaxZ = targetZ + playerRadius;

            rockPlatforms.forEach((box) => {
                if (pMaxX > box.minX && pMinX < box.maxX && pMaxZ > box.minZ && pMinZ < box.maxZ && pMaxY > box.minY && pMinY < box.maxY) {
                    targetZ = player.position.z;
                }
            });

            pMinX = targetX - playerRadius; pMaxX = targetX + playerRadius;
            pMinZ = targetZ - playerRadius; pMaxZ = targetZ + playerRadius;
            
            let currentFloorLevelY = 0; 
            let onTopOfRock = false;

            rockPlatforms.forEach((box) => {
                if (pMaxX > box.minX && pMinX < box.maxX && pMaxZ > box.minZ && pMinZ < box.maxZ) {
                    if (player.position.y >= box.maxY - 0.25 && nextY <= box.maxY) {
                        currentFloorLevelY = box.maxY;
                        onTopOfRock = true;
                    }
                    else if (pMinY < box.maxY && pMaxY > box.minY && verticalVelocity > 0) {
                        nextY = box.minY - 1.8;
                        verticalVelocity = 0;
                    }
                }
            });

            if (nextY <= currentFloorLevelY) {
                nextY = currentFloorLevelY;
                verticalVelocity = 0;
                isGrounded = true;
            } else {
                if (!onTopOfRock && nextY > 0) isGrounded = false;
                else if (nextY <= 0) { nextY = 0; verticalVelocity = 0; isGrounded = true; }
            }

            player.position.y = nextY;

            if (Math.sqrt(targetX*targetX + targetZ*targetZ) < arenaRadius) {
                player.position.x = targetX;
                player.position.z = targetZ;
            }

            if (isInputMoving) {
                if (isGrounded) {
                    const runAnim = animations['Running'] ? 'Running' : 'Walk';
                    fadeToAnimation(runAnim, 0.1);
                }
                let diff = currentTargetRotation - player.rotation.y;
                diff = Math.atan2(Math.sin(diff), Math.cos(diff)); 
                player.rotation.y += diff * turnSpeed * delta;
            } else {
                if (isGrounded) fadeToAnimation('Idle', 0.15);
            }
        }

        function updateCameraPosition() {
            const targetX = player.position.x + camDistance * Math.sin(camPhi) * Math.sin(camTheta);
            const targetY = player.position.y + camDistance * Math.cos(camPhi);
            const targetZ = player.position.z + camDistance * Math.sin(camPhi) * Math.cos(camTheta);
            camera.position.x = THREE.MathUtils.lerp(camera.position.x, targetX, 0.2);
            camera.position.y = THREE.MathUtils.lerp(camera.position.y, targetY, 0.2);
            camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetZ, 0.2);
            camera.lookAt(player.position.x, player.position.y + 1.0, player.position.z);
        }

        function updateCameraMenuPosition() {
            const targetMenuX = player.position.x + 5 * Math.sin(camPhi) * Math.sin(camTheta);
            camera.position.set(targetMenuX, player.position.y + 1.8, player.position.z + 5 * Math.sin(camPhi) * Math.cos(camTheta));
            camera.lookAt(player.position.x - 1.2, player.position.y + 0.8, player.position.z);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
